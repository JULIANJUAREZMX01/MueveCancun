name: Guardián de memoria de agentes

# Falla el PR si un agente cambia código pero no deja una entrada en la memoria compartida.
on:
  pull_request:
    paths-ignore: ["docs/**", "**.md"]

permissions:
  contents: read
  pull-requests: read

jobs:
  memoria:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Verificar memoria actualizada
        run: |
          autor="${{ github.event.pull_request.user.login }}"
          rama="${{ github.head_ref }}"
          # Solo exigimos memoria a PRs de agentes (bots o ramas con prefijo de persona).
          if echo "$rama $autor" | grep -qiE 'sentinel|bolt|palette|speedy|jules|copilot|claude|gemini|bot'; then
            if ! git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -q 'docs/agentes/MEMORIA.md'; then
              echo "::error::PR de agente sin entrada en docs/agentes/MEMORIA.md"
              exit 1
            fi
          fi
          echo "Memoria OK"
