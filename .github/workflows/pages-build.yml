name: Pages · build estatico

# Fase 1 del ADR-2026-005.
#
# Por que no se usan las acciones oficiales de Pages: el repositorio exige que
# TODA accion vaya pinneada a commit completo, y `upload-pages-artifact` llama
# internamente a `upload-artifact@v4` por tag. El job muere en "Set up job" sin
# llegar a construir. Publicar desde la rama `gh-pages` con git evita el
# problema y no necesita ninguna accion de terceros.
#
# Solo publica a mano: mientras el build tenga enlaces absolutos a raiz, un
# despliegue automatico serviria un sitio a medias.

on:
  pull_request:
    paths:
      - 'config/astro.pages.mjs'
      - 'scripts/build-pages.mjs'
      - 'package.json'
      - 'src/**'
      - '.github/workflows/pages-build.yml'
  workflow_dispatch:
    inputs:
      publicar:
        description: 'Publicar en GitHub Pages si el build pasa'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: pages-build
  cancel-in-progress: true

jobs:
  construir:
    name: Build estatico
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: pnpm/action-setup@0c17529a66aca453f9227af23103ed11469b1e47
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Preparar datos
        run: pnpm prepare-data

      - name: Compilar WASM
        run: node scripts/build-wasm.mjs

      - name: Build estatico para Pages
        run: node scripts/build-pages.mjs

      - name: Resumen del build
        if: always()
        run: |
          echo "Este job no toca el build SSR de Vercel." >> $GITHUB_STEP_SUMMARY
          if [ -f dist/.pages-report.json ]; then
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat dist/.pages-report.json >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Publicar en la rama gh-pages
        if: github.event_name == 'workflow_dispatch' && inputs.publicar
        run: |
          set -e
          cd dist
          if [ ! -f index.html ] && [ ! -f es/home/index.html ]; then
            echo "dist no parece un sitio: falta index.html" >&2
            exit 1
          fi
          git init -q
          git checkout -q -b gh-pages
          git add -A
          git -c user.name="kynikos-bot" -c user.email="bot@kynicos.local" \
              commit -q -m "deploy: sitio estatico ${GITHUB_SHA:0:7}"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          echo "Publicado en la rama gh-pages" >> $GITHUB_STEP_SUMMARY
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  humo:
    name: Gate de humo
    if: github.event_name == 'workflow_dispatch' && inputs.publicar
    needs: construir
    runs-on: ubuntu-latest
    steps:
      - name: Esperar a que Pages sirva el sitio
        run: |
          base="https://julianjuarezmx01.github.io/Muevecancun/"
          fallos=0
          for ruta in "" "es/home" "es/rutas"; do
            url="${base}${ruta}"
            codigo=000
            for intento in 1 2 3 4 5 6; do
              codigo=$(curl -s -o /dev/null -w "%{http_code}" -L "$url" || echo 000)
              [ "$codigo" = "200" ] && break
              sleep 10
            done
            echo "$codigo  $url"
            [ "$codigo" = "200" ] || fallos=$((fallos+1))
          done
          if [ "$fallos" -ne 0 ]; then
            echo "Hay $fallos rutas sin 200; no se da el despliegue por bueno." >&2
            exit 1
          fi
          echo "Gate de humo OK" >> $GITHUB_STEP_SUMMARY
